services:
  - type: web
    name: vysalytica-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=. gunicorn api:app --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///api/data/vysalytica.db
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: RATE_LIMIT
        value: 60/minute
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://*.onrender.com
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /healthz
    autoDeploy: true
